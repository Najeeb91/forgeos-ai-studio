name: ForgeOS Web CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/forgeos-web-ci.yml"
  workflow_dispatch:

concurrency:
  group: forgeos-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
